name: Genyx CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality - Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        id: install
        run: npm ci

      - name: Quality checks
        run: npm run check

      - name: Secret policy regression tests
        run: npm run test:security

      - name: Commercial estimate regression tests
        run: npm run test:sales

      - name: Static SEO and asset budget regression tests
        run: npm run test:seo

      - name: Public deployment boundary tests
        run: npm run test:boundary

      - name: Local authenticated dashboard checks
        run: npm run test:admin

      - name: Local CRM CLI smoke check
        run: npm run test:crm

      - name: n8n CRM bridge contract checks
        run: npm run test:bridge

      - name: PostgreSQL CRM authorization and synthetic ingestion checks
        if: ${{ matrix.node-version == 24 }}
        run: npm run test:postgres

      - name: Browser and HTTP smoke checks
        if: ${{ matrix.node-version == 24 }}
        env:
          CHROME_PATH: /usr/bin/google-chrome
          NEXT_TELEMETRY_DISABLED: "1"
          GENYX_CAPTURE: "1"
        run: npm run test:browser

      - name: Upload prototype captures for review
        if: ${{ matrix.node-version == 24 }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: genyx-prototype-captures
          path: .artifacts/genyx-media/*.png
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: Lighthouse laboratory audits
        id: lighthouse
        if: ${{ matrix.node-version == 24 }}
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: bash scripts/lighthouse-ci.sh

      - name: Upload Lighthouse reports
        if: ${{ !cancelled() && steps.lighthouse.outcome != 'skipped' && steps.lighthouse.outcome != '' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: genyx-lighthouse-reports
          path: .artifacts/lighthouse/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

      - name: Static deployment artifact
        if: ${{ matrix.node-version == 24 }}
        run: npm run build:static

      - name: Static release HTTP checks and manifest
        if: ${{ matrix.node-version == 24 }}
        run: npm run test:static

      - name: Upload audited static preview
        if: ${{ matrix.node-version == 24 }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: genyx-static-preview
          path: out/
          if-no-files-found: error
          retention-days: 7

      - name: Upload static preview manifest
        if: ${{ matrix.node-version == 24 }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: genyx-static-manifest
          path: .artifacts/static-manifest.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: Security audit
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run audit:security
